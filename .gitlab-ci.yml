stages:
  - test
  - release
  - prepare-demo-deploy
  - deploy-demo

include:
  # Shared TER release component, pinned to a tag. It contributes the
  # "release-to-ter" job (stage "release", image composer:2, only: tags).
  # Requires TYPO3_API_TOKEN as a masked/protected CI/CD variable - without
  # it the job passes without publishing anything.
  - component: ${CI_SERVER_HOST}/ec/gitlab-ci-cd-components/release-ter/release@1.0.0
    inputs:
      typo3-api-token: ${TYPO3_API_TOKEN}
      typo3-extension-key: ${TYPO3_EXTENSION_KEY}

.private_packages: &private_packages
  - composer config bearer.packages.ecentral.dev "${PACKAGES_TOKEN}"
  - composer config repositories.packistry composer https://packages.ecentral.dev/r/fairway

.deploy-demo:
  stage: deploy-demo
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

validate-composer:
  stage: test
  image: registry.gitlab.com/codemonkey1988/docker-composer-image:2-php8.4
  script:
    - composer validate --no-check-publish --no-check-all --no-interaction

lint-php:
  stage: test
  image: registry.gitlab.com/codemonkey1988/docker-composer-image:2-php$PHP_VERSION
  script:
    - find . -name \*.php ! -path "./vendor/*" -exec php -d display_errors=stderr -l {} > /dev/null \;
  parallel:
    matrix:
      - PHP_VERSION: [ '8.2', '8.3', '8.4' ]

php-cs-fixer:
  stage: test
  image: registry.gitlab.com/codemonkey1988/docker-composer-image:2-php$PHP_VERSION
  before_script:
    - *private_packages
    - COMPOSER_CACHE_DIR=.composer/cache composer install --no-interaction
  script:
    - composer cs:check
  parallel:
    matrix:
      - PHP_VERSION: [ '8.4' ]
  cache:
    key: composer-cache
    paths:
      - .composer/cache

php:rector:
  stage: test
  image: registry.gitlab.com/codemonkey1988/docker-composer-image:2-php$PHP_VERSION
  before_script:
    - *private_packages
    - COMPOSER_CACHE_DIR=.composer/cache composer install --no-interaction
  parallel:
    matrix:
      - PHP_VERSION: [ '8.4' ]
  script:
    - composer rector:check
  cache:
    key: composer-cache
    paths:
      - .composer/cache

phpstan:
  stage: test
  image: registry.gitlab.com/codemonkey1988/docker-composer-image:2-php$PHP_VERSION
  before_script:
    - *private_packages
    - composer require --update-with-all-dependencies --no-interaction --no-ansi --no-progress --no-install typo3/minimal:^13.4
    - COMPOSER_CACHE_DIR=.composer/cache composer install --no-interaction
  script:
    - composer analyze:php
  parallel:
    matrix:
      - PHP_VERSION: [ '8.2', '8.3', '8.4' ]
  cache:
    key: composer-cache
    paths:
      - .composer/cache

# Overrides of the "release-to-ter" job the component above contributes.
#
# Manual until the TER extension key is available again: it was abandoned,
# which revokes all access to it, so ter:publish cannot succeed right now.
# The component brings "only: tags"; a job-level "when" is legacy syntax that
# combines with it, whereas adding "rules" here would be rejected with
# "may not be used with rules: only". allow_failure keeps a blocking manual
# job out of every tag pipeline.
#
# The script is overridden because the component passes $CI_COMMIT_TAG
# verbatim to tailor, while our tags carry a "v" prefix that the TER API
# rejects. tailor itself does not validate the version - only "set-version"
# does - so an unstripped tag fails server-side. Drop this override once the
# component accepts the version as an input.
release-to-ter:
  when: manual
  allow_failure: true
  script:
    - >
      if [ -n "$CI_COMMIT_TAG" ] && [ -n "$TYPO3_API_TOKEN" ]; then
        echo "Preparing upload of release ${CI_COMMIT_TAG} to TER"
        # Make sure no build artefacts end up in the uploaded package.
        git reset --hard HEAD && git clean -fdx
        TAG_MESSAGE="$(git tag -n99 -l "$CI_COMMIT_TAG" | sed 's/^[^ ]*[ ]*//')"
        # The extension key is read from composer.json (extra.typo3/cms).
        /tmp/vendor/bin/tailor ter:publish --comment "${TAG_MESSAGE:-$CI_COMMIT_TAG}" "${CI_COMMIT_TAG#v}"
      fi;

generate-demo-deploy:
  extends: .deploy-demo
  stage: prepare-demo-deploy
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  script:
    - |
      set -eu

      : "${DEMO_SUBDOMAIN:?DEMO_SUBDOMAIN is required}"
      : "${DEMO_COMPOSER_PACKAGES:?DEMO_COMPOSER_PACKAGES is required}"
      : "${DEMO_VERSIONS:?DEMO_VERSIONS is required}"

      case "${DEMO_SUBDOMAIN}${DEMO_COMPOSER_PACKAGES}${DEMO_VERSIONS}" in
        *\"*)
          echo "DEMO_* variables must not contain double quotes."
          exit 1
          ;;
      esac

      cat > generated-demo-deploy.yml <<'YAML'
      stages:
        - deploy-demo
      YAML

      echo "${DEMO_VERSIONS}" | tr ',' '\n' | while read -r version; do
        version="$(echo "${version}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
        [ -n "${version}" ] || continue

        {
          printf '\ndeploy-demo-%s:\n' "${version}"
          printf '  stage: deploy-demo\n'
          printf '  trigger:\n'
          printf '    project: "fairway/demo-server/%s-typo-3-ecentral-de"\n' "${version}"
          printf '    branch: main\n'
          printf '    strategy: mirror\n'
          printf '    inputs:\n'
          printf '      subdomain: "%s"\n' "${DEMO_SUBDOMAIN}"
          printf '      composer-packages:\n'
        } >> generated-demo-deploy.yml

        echo "${DEMO_COMPOSER_PACKAGES}" | tr ',' '\n' | while read -r package; do
          package="$(echo "${package}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [ -n "${package}" ] || continue
          printf '        - "%s"\n' "${package}" >> generated-demo-deploy.yml
        done
      done
  artifacts:
    paths:
      - generated-demo-deploy.yml

deploy-demo:
  extends: .deploy-demo
  needs:
    - job: generate-demo-deploy
      artifacts: true
  trigger:
    include:
      - artifact: generated-demo-deploy.yml
        job: generate-demo-deploy
    strategy: mirror
