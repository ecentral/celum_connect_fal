cache:
  key: main-composer
  paths:
    - .cache

stages:
  - composer
  - unit
  - acceptance
  - functional

unit php 7.4:
  image: ubuntu-20.04
  stage: composer
  except:
    refs:
      - schedules
      - main
  script:
    - Build/Scripts/runTests.sh -s composerValidate -p 7.4
    - Build/Scripts/runTests.sh -s composerInstall -p 7.4
