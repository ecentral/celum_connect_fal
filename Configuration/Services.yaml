services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Brix\CelumFal\Command\RefreshMetaCommand:
    tags:
      - name: 'console.command'
        command: 'celumfal:refreshmeta'

  Brix\CelumFal\Command\CompleteImportCommand:
    tags:
      - name: 'console.command'
        command: 'celumfal:completeimport'

  Brix\CelumFal\Index\Extractor:
    public: true

  Brix\CelumFal\Utility\Cache:
    public: true

  # No resource auto-registration in this file, so every service is listed.
  Brix\CelumFal\Service\StorageConfigurationValidator: ~

  Brix\CelumFal\Service\CelumConnectionProbe: ~

  Brix\CelumFal\Service\ConnectionProbeInterface:
    alias: Brix\CelumFal\Service\CelumConnectionProbe

  # Instantiated by the DataHandler via GeneralUtility::makeInstance()
  Brix\CelumFal\Hooks\StorageConfigurationCheck:
    public: true

  Brix\CelumFal\ToolbarItem\CumulusCacheCleanerItem:
    tags:
      - name: backend.toolbar.item
